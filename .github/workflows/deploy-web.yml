# 请把本文件移动（重命名）到 .github/workflows/deploy-web.yml 才会生效。
# （自动化工具没有写入 .github/workflows 的权限，所以先放在这里。）
name: 构建网页版并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缺少字体/音频时自动生成并提交回仓库
        run: |
          if [ -f assets/fonts/NotoSerifSC-wendao.otf ] && [ -f assets/audio/drone.ogg ]; then
            echo "资源已存在，跳过"; exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
          pip install -q --break-system-packages fonttools numpy
          python3 tools/make_font.py
          python3 tools/make_audio.py
          cp /usr/share/doc/fonts-noto-cjk/copyright assets/fonts/NOTO-LICENSE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: 生成字体与音频资源 [skip ci]" && git push || true

      - name: 缓存 Godot 与导出模板
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: 安装 Godot 与 Web 导出模板
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -d ~/godot-bin
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/web_nothreads_release.zip templates/version.txt -d $T

      - name: 导出网页版
        run: |
          set -e
          G=~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $G --headless --import || true
          mkdir -p build/web
          $G --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
